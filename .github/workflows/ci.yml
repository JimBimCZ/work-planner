name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kanban
          POSTGRES_PASSWORD: kanban
          POSTGRES_DB: kanban
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kanban"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://kanban:kanban@localhost:5432/kanban
      DATABASE_URL_UNPOOLED: postgres://kanban:kanban@localhost:5432/kanban
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      AUTH_SECRET: ci-not-a-real-secret
      AUTH_TRUST_HOST: 'true'
      AUTH_GOOGLE_ID: ci
      AUTH_GOOGLE_SECRET: ci
      AUTH_GITHUB_ID: ci
      AUTH_GITHUB_SECRET: ci
      PUSHER_APP_ID: ${{ secrets.PUSHER_APP_ID }}
      PUSHER_SECRET: ${{ secrets.PUSHER_SECRET }}
      NEXT_PUBLIC_PUSHER_KEY: ${{ secrets.NEXT_PUBLIC_PUSHER_KEY }}
      NEXT_PUBLIC_PUSHER_CLUSTER: ${{ secrets.NEXT_PUBLIC_PUSHER_CLUSTER }}
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: kanban-attachments
      S3_ACCESS_KEY_ID: kanban
      S3_SECRET_ACCESS_KEY: kanban-ci-only
    steps:
      - uses: actions/checkout@v7
      # Not a `services:` entry: that block runs the image's default command
      # and cannot override it, and minio/minio needs `server /data`.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=kanban \
            -e MINIO_ROOT_PASSWORD=kanban-ci-only \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live; then break; fi
            sleep 1
          done
          curl -sf http://localhost:9000/minio/health/live
          docker run --rm --network host --entrypoint sh minio/mc:latest -c "
            mc alias set ci http://localhost:9000 kanban kanban-ci-only &&
            mc mb --ignore-existing ci/kanban-attachments"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
