services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
      POSTGRES_DB: kanban
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kanban']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kanban
      MINIO_ROOT_PASSWORD: kanban-local-only
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the bucket and exits. The app must never create its own
  # bucket — that would be boot-time state, which CLAUDE.md's deployment rules
  # rule out.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 kanban kanban-local-only &&
      mc mb --ignore-existing local/kanban-attachments
      "

  app:
    build:
      context: .
      args:
        # Optional. Without them the app builds and runs correctly with no
        # realtime, which is the supported self-hosting configuration.
        # NEXT_PUBLIC_PUSHER_KEY is inlined at build time, so it must be a
        # build argument, not just an environment variable below — the
        # runtime value alone would still ship an undefined key to the client.
        NEXT_PUBLIC_PUSHER_KEY: ${NEXT_PUBLIC_PUSHER_KEY:-}
        NEXT_PUBLIC_PUSHER_CLUSTER: ${NEXT_PUBLIC_PUSHER_CLUSTER:-}
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://kanban:kanban@postgres:5432/kanban
      AUTH_SECRET: local-development-only
      AUTH_TRUST_HOST: 'true'
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Optional, and server-side only: these are read at runtime, not built
      # into the image, so they don't need to be build arguments.
      PUSHER_APP_ID: ${PUSHER_APP_ID:-}
      PUSHER_SECRET: ${PUSHER_SECRET:-}
      # Server-side only and read at runtime, so not build arguments. Absent
      # these five the board still works and shows no attachment surface.
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: kanban-attachments
      S3_ACCESS_KEY_ID: kanban
      S3_SECRET_ACCESS_KEY: kanban-local-only
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  miniodata:
